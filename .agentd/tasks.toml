# Repository task file (LibraOS Engine's docs/task-file.md).
#
# The check a worker's fix must pass before it is done, including fixes the
# issue trigger starts: every page test, as ui/test.cjs runs them, with the
# jsdom version CI installs. A check runs on a worker only once a person
# approves it for this repository: agentd command approve.
check = "export PATH=\"$HOME/.local/node/bin:$PATH\" && d=$(mktemp -d) && npm install --prefix \"$d\" --no-audit --no-fund --ignore-scripts jsdom@30.1.2 >/dev/null && DASH_UI_DOM_MODULE=\"$d/node_modules/jsdom\" node ui/test.cjs; s=$?; rm -rf \"$d\"; exit $s"
check_timeout = "45m"
